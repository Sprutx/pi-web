<svg xmlns="http://www.w3.org/2000/svg" width="528" height="150" viewBox="0 0 528 150" font-family="system-ui, sans-serif">
  <title>Иконка переноса сессии — варианты</title>
  <rect width="528" height="150" fill="#111418"/>

  <!-- 1. как сейчас: папка, стрелка вниз -->
  <g transform="translate(24,24) scale(3)" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6" />
    <path d="M12 3v8" />
    <path d="m8 7 4 4 4-4" />
  </g>
  <text x="60" y="126" font-size="11" fill="#9ca3af" text-anchor="middle">1. текущая: стрелка вниз</text>

  <!-- 2. та же папка, стрелка вверх -->
  <g transform="translate(160,24) scale(3)" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6" />
    <path d="M12 11V3" />
    <path d="m8 7 4-4 4 4" />
  </g>
  <text x="196" y="126" font-size="11" fill="#9ca3af" text-anchor="middle">2. новая: стрелка вверх</text>

  <!-- 3. две встречные стрелки -->
  <g transform="translate(296,24) scale(3)" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m16 3 4 4-4 4" />
    <path d="M20 7H4" />
    <path d="m8 21-4-4 4-4" />
    <path d="M4 17h16" />
  </g>
  <text x="332" y="126" font-size="11" fill="#9ca3af" text-anchor="middle">3. две стрелки</text>

  <!-- 4. папка со стрелкой внутрь -->
  <g transform="translate(432,24) scale(3)" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2" />
    <path d="M2 13h10" />
    <path d="m9 16 3-3-3-3" />
  </g>
  <text x="468" y="126" font-size="11" fill="#9ca3af" text-anchor="middle">4. папка, стрелка внутрь</text>
</svg>
